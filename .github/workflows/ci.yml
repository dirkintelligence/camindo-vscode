# Tests (scanner, grammar, data) and a trial package on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package (check only)
        run: npx --yes @vscode/vsce@3 package --out camindo-cms-templates.vsix
